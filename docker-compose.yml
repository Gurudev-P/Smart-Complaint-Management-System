services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scms
      POSTGRES_USER: scms
      POSTGRES_PASSWORD: scms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scms -d scms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://scms:scms@db:5432/scms
      SECRET_KEY: ${SECRET_KEY:-change-me-local-dev-secret-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scms.example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
    ports:
      - "8000:8000"

volumes:
  pgdata:
